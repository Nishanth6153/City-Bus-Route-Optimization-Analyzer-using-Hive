version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: transit_postgis
    environment:
      POSTGRES_DB: city_transit
      POSTGRES_USER: transit_admin
      POSTGRES_PASSWORD: transit_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transit_admin -d city_transit"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: transit_backend
    environment:
      - DATABASE_TYPE=sqlite
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: transit_frontend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  pgdata:
